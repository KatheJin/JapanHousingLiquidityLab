[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "japan-housing-liquidity-lab"
version = "0.1.0"
description = "Offline housing liquidity research with synthetic survival data"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = []

[project.scripts]
jhll = "japan_housing_liquidity_lab.__main__:main"

[tool.setuptools.packages.find]
include = ["japan_housing_liquidity_lab*"]

[project.optional-dependencies]
plots = ["matplotlib>=3.8,<4"]
