[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "japan-housing-liquidity-lab"
version = "0.1.0"
description = "Offline housing liquidity research with synthetic survival data"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = []

[project.scripts]
jhll = "japan_housing_liquidity_lab.__main__:main"

[tool.setuptools.packages.find]
include = ["japan_housing_liquidity_lab*"]

[project.optional-dependencies]
plots = ["matplotlib>=3.8,<4"]

model = ["scikit-learn==1.6.1", "numpy==1.26.4", "pandas==2.2.3", "scipy==1.14.1", "joblib>=1.3,<2", "matplotlib>=3.8,<4", "threadpoolctl>=3,<4"]

reins = ["pdfplumber==0.11.10", "pypdf==7.0.0", "Pillow>=12.2,<13", "matplotlib>=3.8,<4"]
